<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WindyMeowMyChart</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">

        <header class="main-header">
          <img src="images/logo.PNG" alt="Логотип" class="logo-img">
          <span class="site-title"><span class="site-name">WindyMeow</span>:<br>everything for a cat on a boat</span>
            
        </header>

      <main class="main-content cart-content">

        <section class="checkout-form cart-page">
          <h1 class="page-title">Корзина</h1>
          <div id="cart-page-items"></div>
          <p id="cart-page-total"></p>
        </section>

        <form action="#" method="post" class="checkout-form">
          <div class="form-group">
            <label for="first-name">Имя</label>
            <input
              type="text"
              name="first_name"
              id="first-name"
              placeholder="Иван"
              minlength="2"
              maxlength="50"
              pattern="[А-ЯЁA-Z][а-яёa-z]+(?:(?: |-)[А-ЯЁA-Z][а-яёa-z]+)*"
              title="Имя должно начинаться с заглавной буквы и содержать только буквы"
              required
            />
          </div>

          <div class="form-group">
            <label for="last-name">Фамилия</label>
            <input
              type="text"
              name="last_name"
              id="last-name"
              placeholder="Иванов"
              minlength="2"
              maxlength="50"
              pattern="[А-ЯЁA-Z][а-яёa-z]+(?:(?: |-)[А-ЯЁA-Z][а-яёa-z]+)*"
              title="Фамилия должна начинаться с заглавной буквы и содержать только буквы"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Контактный номер телефона</label>
            <input
              type="tel"
              name="phone"
              id="phone"
              placeholder="+7 (999) 000-00-00"
              pattern="^\+?[0-9\s\-\(\)]{7,18}$"
              title="Введите корректный номер телефона"
              required
            />
          </div>

          <div class="form-group">
            <label for="street">Улица</label>
            <input
              type="text"
              name="street"
              id="street"
              placeholder="ул. Московская"
              minlength="3"
              maxlength="100"
              required
            />
          </div>

          <div class="form-group">
            <label for="house">Дом</label>
            <input
              type="number"
              name="house"
              id="house"
              placeholder="10"
              min="1"
              max="999"
              step="1"
              required
            />
          </div>

          <div class="form-group">
            <label for="apartment">Квартира</label>
            <input
              type="number"
              name="apartment"
              id="apartment"
              placeholder="5"
              min="1"
              max="9999"
              step="1"
              required
            />
          </div>

          <button type="submit" class="submit-btn">Создать заказ</button>
          <p id="order-message" class="order-message" role="status"></p>
        </form>
      </main>

      <div class="order-modal" id="order-modal" role="dialog" aria-modal="true" aria-labelledby="order-modal-title" hidden>
        <div class="order-modal-content">
          <p class="order-modal-title" id="order-modal-title">Заказ создан!</p>
          <button type="button" class="order-modal-close" id="order-modal-close">Закрыть</button>
        </div>
      </div>

      <footer></footer>

    </div>

    <script src="cart.js"></script>
  </body>
</html>
