<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WindyMeowMyChart</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">

      <header>
      </header>

      <main class="main-content">

        <form action="#" method="post" class="checkout-form">
          <div class="form-group">
            <label for="first-name">Имя</label>
            <input
              type="text"
              name="first_name"
              id="first-name"
              placeholder="Иван"
              required
            />
          </div>

          <div class="form-group">
            <label for="last-name">Фамилия</label>
            <input
              type="text"
              name="last_name"
              id="last-name"
              placeholder="Иванов"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Контактный номер телефона</label>
            <input
              type="tel"
              name="phone"
              id="phone"
              placeholder="+7 (999) 000-00-00"
              pattern="^\+?[0-9\s\-\(\)]{7,18}$"
              title="Введите корректный номер телефона"
              required
            />
          </div>

          <div class="form-group">
            <label for="address">Адрес доставки</label>
            <input
              type="text"
              name="address"
              id="address"
              placeholder="г. Москва, ул. Ленина, д. 10, кв. 5"
              required
            />
          </div>

          <button type="submit" class="submit-btn">Создать заказ</button>
        </form>
      </main>

      <footer></footer>

    </div>

  </body>
</html>
